# HTTPS front for the play server (:8790, loopback only). Appended to the site file by
# deploy/deploy.sh when /etc/letsencrypt/live/__HOST__/ exists.
# The browser talks to this at 24 state reports/s over one WebSocket, so: no proxy buffering,
# long idle timeouts, HTTP/1.1 upgrade passthrough.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __HOST__;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/__HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:jev:10m;
    ssl_session_timeout 1d;

    client_max_body_size 8m;

    # game state stream
    location /ws {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # operator page (ADMIN_PATH in .env.local, substituted by deploy.sh) and the token-guarded
    # admin API + code redemption + coin insert: throttled per IP so neither the token nor codes can be guessed fast
    location = __ADMIN__ {
        limit_req zone=jev_admin burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/api/(admin/|redeem$|sessions$) {
        limit_req zone=jev_admin burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    # /api/* (games, session status, ROM); / redirects to the play page on Vercel (PLAY_BASE_URL)
    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
