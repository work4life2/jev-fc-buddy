# http-context bits for the jev-fc-buddy site (installed to /etc/nginx/conf.d/jev-fc-buddy.conf).
# 5 requests/s per IP on the operator page, the admin API and code redemption. The operator page
# polls twice every few seconds; a guesser gets ~18k tries/hour against a 48-hex token / 36^12 code.
limit_req_zone $binary_remote_addr zone=jev_admin:1m rate=5r/s;
