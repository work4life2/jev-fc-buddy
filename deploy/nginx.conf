# Port 80 for the play server's hostname: only the ACME challenge is served here, everything else
# goes to https. deploy/deploy.sh substitutes __HOST__ from PUBLIC_BASE_URL in .env.local and
# appends deploy/nginx-tls.conf once the certificate exists.
# (The holo-card-agent site on this box owns the default_server on :80; this block only matches
# requests whose Host header is __HOST__.)
server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
